name: Research TOPIX-17 attribution

# Validation branch touch: no production logic change.
on:
  push:
    branches: [main]
    paths:
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_attribution.yml
  pull_request:
    branches: [main]
    paths:
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_attribution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run Phase-8 attribution study
        run: python research_attribution.py --out-dir research_attribution
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-attribution-research
          path: research_attribution/
          if-no-files-found: warn
      - name: Commit outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research_attribution/REPORT.md research_attribution/metadata.json research_attribution/attribution.csv research_attribution/equity_10bp.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record cash vs selection attribution'
          git push
