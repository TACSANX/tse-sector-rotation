name: Research TOPIX-17 market state

on:
  push:
    branches: [main]
    paths:
      - research_market_state.py
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_market_state.yml
  pull_request:
    branches: [main]
    paths:
      - research_market_state.py
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_market_state.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run Phase-15 market-state study
        run: python research_market_state.py --out-dir research_market_state
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-market-state-research
          path: research_market_state/
          if-no-files-found: warn
# validation trigger
