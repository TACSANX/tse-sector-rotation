name: Daily TSE 33-sector screen

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "Asia/Tokyo"
  pull_request:
    branches: [main]
    paths:
      - screener.py
      - config/industry_constituents.csv
      - config/fundamentals.csv
      - scripts/update_readme.py
      - requirements.txt
      - .github/workflows/screen.yml

permissions:
  contents: write

concurrency:
  group: tse-33-daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 33-industry screener
        run: python screener.py

      - name: Update README ranking
        run: python scripts/update_readme.py

      - name: Commit changed outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/industry_latest.csv data/etf_latest.csv data/industry_history.csv data/etf_history.csv data/macro.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: update TSE 33-sector ranking $(TZ=Asia/Tokyo date +%F)"
          git push

# validation trigger
