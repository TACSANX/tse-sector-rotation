name: Research TOPIX-17 self-financing

# Validation trigger only.
on:
  push:
    branches: [main]
    paths:
      - research_dual_v2.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_dual_v2.yml
  pull_request:
    branches: [main]
    paths:
      - research_dual_v2.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_dual_v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run corrected Phase-2.1 study
        run: python research_dual_v2.py --out-dir research_dual_v2
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-self-financing-research
          path: research_dual_v2/
          if-no-files-found: warn
      - name: Commit outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research_dual_v2/REPORT.md research_dual_v2/metadata.json research_dual_v2/grid_results.csv research_dual_v2/shortlist.csv research_dual_v2/equity_10bp.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record corrected self-financing results'
          git push
