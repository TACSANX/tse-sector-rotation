name: Research TOPIX-17 signal validity

on:
  push:
    branches: [main]
    paths:
      - research_signal_validity.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_signal_validity.yml
  pull_request:
    branches: [main]
    paths:
      - research_signal_validity.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_signal_validity.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate scipy
      - name: Run Phase-12 cross-sectional signal test
        run: python research_signal_validity.py --out-dir research_signal_validity --bootstrap-reps 5000
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-signal-validity-research
          path: research_signal_validity/
          if-no-files-found: warn
