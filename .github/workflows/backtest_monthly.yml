name: Backtest monthly price core

on:
  push:
    branches:
      - main
    paths:
      - backtest_monthly.py
      - .github/workflows/backtest_monthly.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run monthly price-core backtest
        run: python backtest_monthly.py --download-start 2008-03-25 --signal-start 2012-01-01 --cost-bps 10 --out-dir backtest_monthly
      - name: Commit monthly results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backtest_monthly/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record monthly backtest results"
          git push
