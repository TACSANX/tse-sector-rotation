name: Research TOPIX-17 tail profile

on:
  push:
    branches: [main]
    paths:
      - research_tail_profile.py
      - research_broad_core_attribution.py
      - research_broad_core.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_tail_profile.yml
  pull_request:
    branches: [main]
    paths:
      - research_tail_profile.py
      - research_broad_core_attribution.py
      - research_broad_core.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_tail_profile.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run Phase-18 tail-profile study
        run: python research_tail_profile.py --out-dir research_tail_profile --reps 5000
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-tail-profile-research
          path: research_tail_profile/
          if-no-files-found: warn
