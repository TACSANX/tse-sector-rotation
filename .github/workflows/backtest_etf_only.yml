name: Backtest TOPIX-17 ETF core

on:
  push:
    branches: [main]
    paths:
      - backtest_etf_only.py
      - .github/workflows/backtest_etf_only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etf-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monthly backtest
        run: python backtest_etf_only.py --rebalance monthly --cost-bps 10 --out-dir backtest_etf_only/monthly
      - name: Weekly backtest
        run: python backtest_etf_only.py --rebalance weekly --cost-bps 10 --out-dir backtest_etf_only/weekly
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backtest_etf_only/monthly backtest_etf_only/weekly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record TOPIX-17 ETF-core backtests"
          git push
