name: Research TOPIX-17 dual momentum

on:
  push:
    branches: [main]
    paths:
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_dual.yml
  pull_request:
    branches: [main]
    paths:
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_dual.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run Phase-2 dual-momentum study
        run: python research_dual_momentum.py --out-dir research_dual
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-dual-momentum-research
          path: research_dual/
          if-no-files-found: warn
      - name: Commit outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research_dual/REPORT.md research_dual/metadata.json research_dual/grid_results.csv research_dual/shortlist.csv research_dual/monthly_top3_10bp_equity.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record dual-momentum results'
          git push
