name: Research TOPIX-17 randomization

on:
  push:
    branches: [main]
    paths:
      - research_randomization.py
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_randomization.yml
  pull_request:
    branches: [main]
    paths:
      - research_randomization.py
      - research_attribution.py
      - research_core_tilt.py
      - research_portfolio.py
      - research_dual_momentum.py
      - research_backtest_official.py
      - .github/workflows/research_randomization.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run Phase-11 randomized-ranking study
        run: python research_randomization.py --out-dir research_randomization --reps 2000
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topix17-randomization-research
          path: research_randomization/
          if-no-files-found: warn
# validation trigger
