# validation trigger 2026-08-21
name: Backtest TSE sector rotation

on:
  push:
    branches:
      - main
      - backtest/2026-08-21
    paths:
      - backtest.py
      - .github/workflows/backtest.yml
  pull_request:
    branches:
      - main
    paths:
      - backtest.py
      - .github/workflows/backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Run backtest
        run: python backtest.py --download-start 2008-03-25 --signal-start 2012-01-01 --cost-bps 10

      - name: Upload backtest outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-rotation-backtest
          path: backtest/
          if-no-files-found: warn

      - name: Commit backtest outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backtest/REPORT.md backtest/results.json backtest/summary.csv backtest/annual_returns.csv backtest/equity.csv backtest/signals.csv backtest/trades.csv
          if git diff --cached --quiet; then
            echo "No backtest changes."
            exit 0
          fi
          git commit -m "test: record sector-rotation backtest results"
          git push
